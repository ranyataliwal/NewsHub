<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NewsHub | Latest News</title>

    <style>

        /* =====================================================
           BASIC RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
            transition: 0.3s ease;
        }

        button,
        input,
        select {
            font-family: inherit;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {
            background:
                linear-gradient(
                    135deg,
                    #0f2d63 0%,
                    #174ea6 45%,
                    #2563eb 100%
                );

            color: white;
            padding: 30px 6% 38px;

            position: relative;
            overflow: hidden;
        }


        /* Decorative circles */

        header::before {
            content: "";
            position: absolute;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background: rgba(255,255,255,0.05);

            right: -100px;
            top: -150px;
        }


        header::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: rgba(255,255,255,0.04);

            left: 35%;
            bottom: -130px;
        }


        .headerContent {
            position: relative;
            z-index: 2;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 32px;
        }


        .logo {
            display: flex;
            align-items: center;
            gap: 13px;
        }


        /* Professional CSS logo */

        .logoMark {
            width: 48px;
            height: 48px;

            background: white;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.18);
        }


        .logoMark::before {
            content: "";

            width: 25px;
            height: 4px;

            background: #2563eb;

            position: absolute;
            top: 12px;

            border-radius: 5px;
        }


        .logoMark::after {
            content: "";

            width: 25px;
            height: 18px;

            border-top: 3px solid #64748b;
            border-bottom: 3px solid #64748b;

            position: absolute;
            top: 21px;
        }


        .logoText {
            font-size: 36px;
            font-weight: 800;

            letter-spacing: -1.5px;
        }


        .logoText span {
            color: #8fc5ff;
        }


        .tagline {
            font-size: 12px;

            color: rgba(255,255,255,0.75);

            letter-spacing: 1.8px;

            margin-top: 2px;
        }


        /* =====================================================
           THEME BUTTON
        ===================================================== */

        #themeBtn {
            width: 48px;
            height: 48px;

            border: 1px solid rgba(255,255,255,0.2);

            background: rgba(255,255,255,0.12);

            backdrop-filter: blur(8px);

            color: white;

            border-radius: 12px;

            font-size: 20px;

            cursor: pointer;

            transition: 0.25s;
        }


        #themeBtn:hover {
            background: rgba(255,255,255,0.22);

            transform: translateY(-2px);
        }


        /* =====================================================
           SEARCH
        ===================================================== */

        .searchBox {
            max-width: 900px;

            margin: auto;

            display: flex;

            background: white;

            padding: 6px;

            border-radius: 14px;

            box-shadow:
                0 15px 35px rgba(0,0,0,0.18);
        }


        #searchInput {
            flex: 1;

            border: none;

            outline: none;

            padding: 15px 18px;

            font-size: 17px;

            color: #172033;

            background: transparent;
        }


        #searchInput::placeholder {
            color: #94a3b8;
        }


        #searchBtn {
            border: none;

            background: #facc15;

            color: #111827;

            padding: 0 27px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;
        }


        #searchBtn:hover {
            background: #fde047;

            transform: translateY(-1px);
        }


        /* =====================================================
           CATEGORY NAVIGATION
        ===================================================== */

        .filters {
            background: #111c32;

            padding: 15px 6%;

            display: flex;

            gap: 10px;

            overflow-x: auto;

            position: sticky;

            top: 0;

            z-index: 50;

            scrollbar-width: none;
        }


        .filters::-webkit-scrollbar {
            display: none;
        }


        .filterBtn {
            flex-shrink: 0;

            border: 1px solid #33445f;

            background: transparent;

            color: #dbe5f5;

            padding: 10px 18px;

            border-radius: 30px;

            cursor: pointer;

            font-size: 14px;

            transition: 0.25s;
        }


        .filterBtn:hover {
            border-color: #60a5fa;

            color: white;

            background: rgba(37,99,235,0.15);
        }


        .filterBtn.active {
            background: #2563eb;

            border-color: #2563eb;

            color: white;

            box-shadow:
                0 5px 15px rgba(37,99,235,0.3);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {
            max-width: 1400px;

            margin: auto;

            padding: 30px 6% 60px;
        }


        /* =====================================================
           COUNTRY + REFRESH
        ===================================================== */

        .toolbar {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .countryBox {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        .countryLabel {
            color: #64748b;

            font-size: 14px;

            font-weight: 600;
        }


        #countrySelect {
            padding: 10px 35px 10px 14px;

            border-radius: 9px;

            border: 1px solid #d7deea;

            background: white;

            color: #172033;

            outline: none;

            cursor: pointer;

            font-size: 14px;
        }


        #refreshBtn {
            border: 1px solid #d7deea;

            background: white;

            color: #334155;

            padding: 10px 17px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: 600;

            transition: 0.25s;
        }


        #refreshBtn:hover {
            border-color: #2563eb;

            color: #2563eb;

            transform: translateY(-2px);
        }


        /* =====================================================
           PAGE TITLE
        ===================================================== */

        .titleArea {
            display: flex;

            align-items: end;

            justify-content: space-between;

            margin-bottom: 8px;
        }


        #pageTitle {
            font-size: 34px;

            letter-spacing: -0.8px;

            color: #111827;
        }


        .titleLine {
            width: 55px;

            height: 4px;

            background: #2563eb;

            border-radius: 10px;

            margin-top: 10px;
        }


        #count {
            color: #718096;

            font-size: 14px;

            margin: 20px 0 25px;
        }


        /* =====================================================
           NEWS GRID
        ===================================================== */

        #newsContainer {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 26px;
        }


        /* =====================================================
           NEWS CARD
        ===================================================== */

        .card {
            background: white;

            border: 1px solid #e5eaf1;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 5px 20px rgba(15,23,42,0.06);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .card:hover {
            transform: translateY(-6px);

            box-shadow:
                0 18px 40px rgba(15,23,42,0.12);
        }


        /* =====================================================
           IMAGE
        ===================================================== */

        .imageBox {
            width: 100%;

            height: 245px;

            background:
                linear-gradient(
                    135deg,
                    #e9eef7,
                    #dbe5f2
                );

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        .imageBox img {
            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition: transform 0.5s ease;
        }


        .card:hover .imageBox img {
            transform: scale(1.03);
        }


        .noImage {
            color: #64748b;

            font-size: 15px;

            font-weight: 600;

            text-align: center;
        }


        /* =====================================================
           CARD CONTENT
        ===================================================== */

        .cardContent {
            padding: 21px;
        }


        .source {
            color: #2563eb;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 9px;

            text-transform: uppercase;

            letter-spacing: 0.4px;
        }


        .card h2 {
            color: #172033;

            font-size: 21px;

            line-height: 1.4;

            margin-bottom: 12px;
        }


        .description {
            color: #64748b;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 15px;

            display: -webkit-box;

            -webkit-line-clamp: 4;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        .date {
            color: #94a3b8;

            font-size: 12px;

            margin-bottom: 17px;
        }


        /* =====================================================
           READ BUTTON
        ===================================================== */

        .readBtn {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            text-decoration: none;

            color: #2563eb;

            font-size: 14px;

            font-weight: 700;

            padding: 9px 13px;

            border: 1px solid #bfdbfe;

            border-radius: 8px;

            transition: 0.25s;
        }


        .readBtn:hover {
            background: #2563eb;

            color: white;

            border-color: #2563eb;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {
            grid-column: 1 / -1;

            text-align: center;

            padding: 70px;

            color: #2563eb;

            font-size: 18px;
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .error {
            grid-column: 1 / -1;

            text-align: center;

            background: white;

            border: 1px solid #e5eaf1;

            border-radius: 15px;

            padding: 55px;

            color: #64748b;

            font-size: 16px;
        }


        /* =====================================================
           DARK MODE
        ===================================================== */

        body.dark {
            background: #0b1324;

            color: #e2e8f0;
        }


        body.dark main {
            background: #0b1324;
        }


        body.dark #pageTitle {
            color: #f1f5f9;
        }


        body.dark .countryLabel {
            color: #94a3b8;
        }


        body.dark #countrySelect {
            background: #172033;

            color: #e2e8f0;

            border-color: #334155;
        }


        body.dark #refreshBtn {
            background: #172033;

            color: #e2e8f0;

            border-color: #334155;
        }


        body.dark .card {
            background: #172033;

            border-color: #26344c;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.2);
        }


        body.dark .card h2 {
            color: #f1f5f9;
        }


        body.dark .description {
            color: #a9b7ca;
        }


        body.dark .imageBox {
            background:
                linear-gradient(
                    135deg,
                    #1e293b,
                    #26344c
                );
        }


        body.dark .noImage {
            color: #94a3b8;
        }


        body.dark .error {
            background: #172033;

            border-color: #26344c;
        }


        body.dark #count {
            color: #94a3b8;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            header {
                padding: 24px 4% 30px;
            }


            .logoText {
                font-size: 29px;
            }


            .logoMark {
                width: 42px;
                height: 42px;
            }


            .tagline {
                display: none;
            }


            .top {
                margin-bottom: 25px;
            }


            #themeBtn {
                width: 43px;
                height: 43px;
            }


            .searchBox {
                flex-direction: column;

                padding: 6px;
            }


            #searchBtn {
                padding: 14px;
            }


            .filters {
                padding: 13px 4%;
            }


            main {
                padding: 25px 4% 50px;
            }


            .toolbar {
                align-items: flex-start;

                gap: 12px;

                flex-direction: column;
            }


            .titleArea {
                display: block;
            }


            #pageTitle {
                font-size: 28px;
            }


            #newsContainer {
                grid-template-columns: 1fr;

                gap: 20px;
            }


            .imageBox {
                height: 215px;
            }


            .card h2 {
                font-size: 19px;
            }

        }

    </style>
</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="headerContent">

            <div class="top">

                <div class="logo">

                    <div class="logoMark"></div>

                    <div>

                        <div class="logoText">
                            News<span>Hub</span>
                        </div>

                        <div class="tagline">
                            YOUR DAILY NEWS DESTINATION
                        </div>

                    </div>

                </div>


                <button id="themeBtn">
                    ☀
                </button>

            </div>


            <!-- SEARCH -->

            <div class="searchBox">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for news, topics or stories..."
                >

                <button id="searchBtn">
                    Search
                </button>

            </div>

        </div>

    </header>


    <!-- =====================================================
         CATEGORY NAVIGATION
    ====================================================== -->

    <div class="filters">

        <button
            class="filterBtn active"
            data-category=""
        >
            Latest
        </button>


        <button
            class="filterBtn"
            data-category="breaking"
        >
            Breaking
        </button>


        <button
            class="filterBtn"
            data-category="technology"
        >
            Technology
        </button>


        <button
            class="filterBtn"
            data-category="business"
        >
            Business
        </button>


        <button
            class="filterBtn"
            data-category="science"
        >
            Science
        </button>


        <button
            class="filterBtn"
            data-category="sports"
        >
            Sports
        </button>


        <button
            class="filterBtn"
            data-category="world"
        >
            World
        </button>


        <button
            class="filterBtn"
            data-category="crime"
        >
            Crime
        </button>

    </div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- COUNTRY + REFRESH -->

        <div class="toolbar">

            <div class="countryBox">

                <span class="countryLabel">
                    News from
                </span>

                <select id="countrySelect">

                    <option value="in">
                        🇮🇳 India
                    </option>

                    <option value="us">
                        🇺🇸 USA
                    </option>

                    <option value="gb">
                        🇬🇧 UK
                    </option>

                    <option value="ae">
                        🇦🇪 UAE
                    </option>

                    <option value="ru">
                        🇷🇺 Russia
                    </option>

                </select>

            </div>


            <button id="refreshBtn">
                ↻ Refresh
            </button>

        </div>


        <!-- TITLE -->

        <div class="titleArea">

            <div>

                <h1 id="pageTitle">
                    Latest News
                </h1>

                <div class="titleLine"></div>

            </div>

        </div>


        <div id="count">
            Loading news...
        </div>


        <!-- NEWS -->

        <div id="newsContainer"></div>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           API KEY
        ===================================================== */

        const API_KEY = "pub_bed9fa1bd59f4ca98df2edcbb8fc465d";


        /* =====================================================
           VARIABLES
        ===================================================== */

        let currentCategory = "";

        let currentCountry = "in";


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const newsContainer =
            document.getElementById("newsContainer");

        const count =
            document.getElementById("count");

        const searchInput =
            document.getElementById("searchInput");

        const searchBtn =
            document.getElementById("searchBtn");

        const refreshBtn =
            document.getElementById("refreshBtn");

        const themeBtn =
            document.getElementById("themeBtn");

        const countrySelect =
            document.getElementById("countrySelect");

        const pageTitle =
            document.getElementById("pageTitle");


        /* =====================================================
           GET NEWS
        ===================================================== */

        async function getNews() {

            newsContainer.innerHTML = `
                <div class="loading">
                    Loading latest news...
                </div>
            `;


            count.innerText = "";


            try {

                let url =
                    `https://newsdata.io/api/1/latest?apikey=${API_KEY}`;


                /* COUNTRY */

                url +=
                    `&country=${currentCountry}`;


                /* LANGUAGE */

                url +=
                    `&language=en,hi`;


                /* IMAGE */

                url +=
                    `&image=1`;


                /* CATEGORY */

                if (currentCategory !== "") {

                    url +=
                        `&category=${currentCategory}`;

                }


                /* SEARCH */

                const searchText =
                    searchInput.value.trim();


                if (searchText !== "") {

                    url +=
                        `&q=${encodeURIComponent(searchText)}`;

                }


                /* API CALL */

                const response =
                    await fetch(url);


                const data =
                    await response.json();


                if (data.status !== "success") {

                    throw new Error(
                        data.message || "API Error"
                    );

                }


                displayNews(data.results);

            }


            catch (error) {

                console.log(error);


                newsContainer.innerHTML = `
                    <div class="error">
                        Unable to load news.
                        <br><br>
                        Please check your API key
                        or internet connection.
                    </div>
                `;


                count.innerText = "";

            }

        }


        /* =====================================================
           DISPLAY NEWS
        ===================================================== */

        function displayNews(articles) {

            newsContainer.innerHTML = "";


            /* NO NEWS */

            if (
                !articles ||
                articles.length === 0
            ) {

                newsContainer.innerHTML = `
                    <div class="error">
                        No news found for this search.
                    </div>
                `;


                count.innerText =
                    "0 articles found";


                return;

            }


            /* COUNT */

            count.innerText =
                `Showing ${articles.length} latest articles`;


            /* LOOP */

            articles.forEach(article => {


                const card =
                    document.createElement("article");


                card.className =
                    "card";


                /* IMAGE */

                const image =
                    article.image_url;


                let imageHTML;


                if (image) {

                    imageHTML = `

                        <div class="imageBox">

                            <img
                                src="${image}"
                                alt="News Image"

                                onerror="
                                    this.style.display='none';

                                    this.parentElement.innerHTML =
                                    '<div class=&quot;noImage&quot;>📰 Image not available</div>';
                                "
                            >

                        </div>

                    `;

                }


                else {

                    imageHTML = `

                        <div class="imageBox">

                            <div class="noImage">
                                📰 Image not available
                            </div>

                        </div>

                    `;

                }


                /* SOURCE */

                const source =
                    article.source_name ||
                    "News Source";


                /* TITLE */

                const title =
                    article.title ||
                    "Untitled News";


                /* DESCRIPTION */

                const description =
                    article.description ||
                    "No description available for this article.";


                /* DATE */

                const date =
                    article.pubDate ||
                    "Date not available";


                /* LINK */

                const link =
                    article.link ||
                    "#";


                /* CARD */

                card.innerHTML = `

                    ${imageHTML}

                    <div class="cardContent">

                        <div class="source">
                            ${source}
                        </div>

                        <h2>
                            ${title}
                        </h2>

                        <p class="description">
                            ${description}
                        </p>

                        <div class="date">
                            ${date}
                        </div>

                        <a
                            class="readBtn"
                            href="${link}"
                        >
                            Read Full Story →
                        </a>

                    </div>

                `;


                newsContainer.appendChild(card);

            });

        }


        /* =====================================================
           CATEGORY BUTTONS
        ===================================================== */

        const categoryButtons =
            document.querySelectorAll(".filterBtn");


        categoryButtons.forEach(button => {

            button.addEventListener(
                "click",
                () => {


                    categoryButtons.forEach(btn => {

                        btn.classList.remove("active");

                    });


                    button.classList.add("active");


                    currentCategory =
                        button.dataset.category;


                    if (currentCategory === "") {

                        pageTitle.innerText =
                            "Latest News";

                    }

                    else {

                        pageTitle.innerText =
                            button.innerText;

                    }


                    getNews();

                }
            );

        });


        /* =====================================================
           SEARCH
        ===================================================== */

        searchBtn.addEventListener(
            "click",
            getNews
        );


        searchInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    getNews();

                }

            }
        );


        /* =====================================================
           COUNTRY
        ===================================================== */

        countrySelect.addEventListener(
            "change",
            function() {

                currentCountry =
                    countrySelect.value;

                getNews();

            }
        );


        /* =====================================================
           REFRESH
        ===================================================== */

        refreshBtn.addEventListener(
            "click",
            getNews
        );


        /* =====================================================
           DARK MODE
        ===================================================== */

        themeBtn.addEventListener(
            "click",
            function() {

                document.body.classList.toggle("dark");


                if (
                    document.body.classList.contains("dark")
                ) {

                    themeBtn.innerText = "☾";

                }

                else {

                    themeBtn.innerText = "☀";

                }

            }
        );


        /* =====================================================
           INITIAL LOAD
        ===================================================== */

        getNews();


    </script>

</body>

</html>
